[workspace]
members = [
    "crates/core",
    "crates/riscv",
    "crates/zkp",
    "crates/evm",
    "crates/sbf",
]
resolver = "2"

[workspace.dependencies]
# Internal crates
metavm-core = { path = "crates/core" }
metavm-riscv = { path = "crates/riscv" }
metavm-zkp = { path = "crates/zkp" }
metavm-evm = { path = "crates/evm" }
metavm-sbf = { path = "crates/sbf" }

# Ceremonyclient crates
bls48581 = { path = "../monorepo/crates/bls48581" }
ed448-bulletproofs = { path = "../monorepo/crates/bulletproofs" }
verenc = { path = "../monorepo/crates/verenc" }

# External dependencies
curve25519-dalek = "4.1.3"
rand = "0.8.5"
sha3 = "0.10"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
goblin = "0.9"
blst = "0.3"
revm = { version = "36", default-features = false, features = ["std"] }
solana_rbpf = "0.8"
serde_json = "1.0"
ureq = { version = "2", features = ["json"] }
base64 = "0.22"
rayon = "1.10"
